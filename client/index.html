<!doctype html>
<html lang="en" data-theme="ultragrade-classic">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101612" />
    <meta name="description" content="One-stop grade calculator and student planner for Ontario students" />

    <!-- Apply the persisted theme BEFORE first paint (no flash of the wrong
         theme). `ultragrade_theme` is written by applyThemeToDocument() in
         src/hooks/useThemeTransition.js; colours = each theme's base-100. -->
    <script>
      (function () {
        try {
          var COLORS = { 'ultragrade-classic': '#101612', 'ultragrade-light': '#f5f6f3' };
          var saved = localStorage.getItem('ultragrade_theme');
          var theme = COLORS[saved] ? saved : 'ultragrade-classic';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', COLORS[theme]);
        } catch (e) { /* keep the html default (dark) on any failure */ }
      })();
    </script>

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- PWA / iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ultraGrade" />
