name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --prefix client --omit=dev --audit-level=high
      - run: npm audit --prefix server --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
